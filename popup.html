<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 14px; }
    h3 { margin: 0 0 10px 0; font-size: 16px; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
    .hint { font-size: 11px; color: #94a3b8; margin-bottom: 10px; }
    
    /* Arama ve Filtre Alanı */
    .filter-container { display: flex; gap: 6px; margin-bottom: 10px; }
    #searchBox {
      flex: 1;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    #searchBox:focus { border-color: #38bdf8; }

    #categoryFilter {
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 7px 6px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }

    .card { background: #1e293b; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-left: 3px solid #10b981; cursor: pointer; transition: background 0.2s; position: relative; }
    .card:hover { background: #273548; }
    
    .meta { font-size: 10px; color: #94a3b8; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    
    /* Kategori Rozeti */
    .badge { background: #334155; color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: bold; }
    
    .text { font-size: 12px; line-height: 1.4; max-height: 60px; overflow: hidden; text-overflow: ellipsis; }
    
    button { background: #334155; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; width: 100%; margin-top: 6px; }
    button:hover { background: #475569; }
  </style>
</head>
<body>
  <h3>ContextBridge <span>v1.2</span></h3>
  <div class="hint">Kaydet: <b>Alt + S</b> &nbsp;|&nbsp; Tıkla: <b>Panoya Kopyala</b></div>
  
  <!-- Arama ve Kategori Filtresi -->
  <div class="filter-container">
    <input type="text" id="searchBox" placeholder="Hafızada ara...">
    <select id="categoryFilter">
      <option value="all">Tümü</option>
      <option value="Prompt">Prompt</option>
      <option value="Kod">Kod</option>
      <option value="Not">Not</option>
    </select>
  </div>

  <div id="list"></div>
  <button id="clear">Tüm Hafızayı Temizle</button>
  <script src="popup.js"></script>
</body>
</html>
